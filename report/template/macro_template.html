<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT-over-TLS Macrobenchmark</title>
    <style>
        :root {
            --page: #f5f2ed;
            --surface: #ffffff;
            --ink: #292431;
            --muted: #6f6877;
            --border: #e5e0da;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: radial-gradient(circle at top left, rgba(124, 58, 237, 0.08), transparent 34rem), var(--page);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
        }
        .page { width: min(1320px, calc(100% - 40px)); margin: 28px auto 42px; }
        .hero {
            padding: 40px;
            border-radius: 26px;
            background: linear-gradient(135deg, #2d2441 0%, #4f3b78 58%, #7c3aed 100%);
            color: #ffffff;
            box-shadow: 0 18px 55px rgba(42, 36, 48, 0.09);
        }
        .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
        h1 { margin: 12px 0; font-size: clamp(30px, 4vw, 48px); line-height: 1.08; letter-spacing: -0.04em; }
        h2 { margin: 0 0 12px; font-size: 24px; letter-spacing: -0.025em; }
        .section {
            margin-top: 22px;
            padding: 26px;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: var(--surface);
            box-shadow: 0 12px 36px rgba(42, 36, 48, 0.055);
        }
        .section p { color: var(--muted); }
        figure { margin: 20px 0; }
        img { display: block; max-width: 100%; margin: auto; }
        figcaption { margin-top: 10px; color: var(--muted); font-size: 13px; }
        .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead { background: #f2eff6; }
        th, td { padding: 12px 14px; text-align: right; border-bottom: 1px solid var(--border); }
        th { color: #4d435d; }
        td { font-variant-numeric: tabular-nums; white-space: nowrap; }
        th:first-child, td:first-child { text-align: left; }
        tbody tr:last-child td { border-bottom: 0; }
        @media (max-width: 700px) {
            .page { width: calc(100% - 24px); margin-top: 12px; }
            .hero, .section { padding: 22px; }
        }
    </style>
</head>
<body>
<main class="page">
    <header class="hero">
        <div class="eyebrow">MQTT-over-TLS · JSON baseline</div>
        <h1>Macrobenchmark</h1>
    </header>

    <section class="section">
        <h2>Recorded workloads</h2>
        <div class="table-wrapper">{{SampleCountsTable}}</div>
    </section>

    <section class="section">
        <h2>End-to-end latency</h2>
        <figure>
            <img src="{{LatencyPlot}}">
        </figure>
        <div class="table-wrapper">{{LatencyTable}}</div>
    </section>

    <section class="section">
        <h2>CPU cycles for the fixed workload</h2>
        <figure>
            <img src="{{CpuCyclesPlot}}">
        </figure>
        <div class="table-wrapper">{{CpuCyclesTable}}</div>
    </section>
</main>
</body>
</html>
