      context: .
      dockerfile: Dockerfile
    container_name: payload-scaling-benchmark
    restart: "no"
    tty: true
    env_file:
      - ./config/benchmark.env
    volumes:
      - ./results:/results
    command: ["./run-payload-scaling.sh"]

  attribute-key-scaling:
