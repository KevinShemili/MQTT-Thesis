name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test and Analyze
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      COVERAGE_RCFILE: .sonar/.coveragerc

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python Dependencies
        run: python -m pip install -r requirements.txt

      - name: Check and Test Go
        run: |
          mkdir -p .sonar/reports

          set -a
          source environment/benchmark.env
          set +a

          go vet ./...
          go test -count=1 -coverpkg=./... \
            -coverprofile=.sonar/reports/coverage-go.out ./...

      - name: Check and Test Python
        run: |
          python -m compileall -q report orchestrate utility/python
          python -m coverage run -m pytest -v report orchestrate utility/python
          python -m coverage xml

      - name: Analyze With SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dproject.settings=.sonar/sonar-project.properties
