name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        working-directory: orchestrate/laptop
        run: docker compose config --quiet

      - name: Validate Image Build
        run: docker build --tag mqtt-thesis-ci --file orchestrate/laptop/Dockerfile .

      - name: Validate Compilation
        run: |
          docker run --rm mqtt-thesis-ci sh -ec '
            cd benchmark
            go vet ./...
            cd ..
            python3 -m compileall -q report
          '

      - name: Validate Tests
        run: |
          docker run --rm \
            --env-file environment/benchmark.env \
            mqtt-thesis-ci sh -ec '
              cd benchmark
              go test ./...
            '
