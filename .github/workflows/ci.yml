name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Set Up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Vet
        run: go vet ./...

      - name: Run Tests
        run: |
          set -a
          source environment/benchmark.env
          set +a
          go test -count=1 ./...

  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Compilation
        run: python -m compileall -q report test/unit

      - name: Run Tests
        env:
          PYTHONPATH: .
        run: python -m pytest -v test/unit
